name: Deploy to Production

on:
  workflow_dispatch:  # Manual trigger only — no auto-deploy to production

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production  # Requires approval if environment protection rules are set

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build:prod

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Deploy to Firebase Hosting + Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRODUCTION }}' > ${{ runner.temp }}/firebase-key.json
          npm install -g firebase-tools
          firebase deploy --only hosting,functions --config firebase.prod.json --project edusync-sis --non-interactive
