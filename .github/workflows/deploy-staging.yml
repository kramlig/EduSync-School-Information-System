name: Deploy to Staging

on:
  workflow_dispatch:  # Manual trigger
  push:
    branches:
      - main  # Auto-deploy when pushing to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build for staging
        run: npm run build:uat
      
      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-key.json
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}' > ${{ runner.temp }}/firebase-key.json
          npm install -g firebase-tools
          firebase deploy --only hosting --project edusync-staging --non-interactive
