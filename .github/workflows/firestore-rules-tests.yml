name: Firestore security rules tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rules-tests:
    name: Run Firestore rules unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify firebase-tools
        run: npx firebase --version

      - name: Run Firestore emulator and rules tests (capture log)
        # emulators:exec sets FIRESTORE_EMULATOR_HOST for the spawned command
        # Capture stdout+stderr to a file so we can parse and upload artifacts
        run: |
          mkdir -p test-artifacts
          npx firebase emulators:exec --only firestore --project emu-test -- node scripts/tests/firestore-rules.test.cjs > test-artifacts/emulator-output.log 2>&1 || true

      - name: Parse test output to JUnit XML
        run: |
          node scripts/tests/parse-test-output-to-junit.cjs test-artifacts/emulator-output.log test-artifacts/firestore-rules-junit.xml

      - name: Upload artifacts (logs + junit)
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-test-artifacts
          path: test-artifacts
