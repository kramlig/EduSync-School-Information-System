name: Firestore rules CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-rules:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run rules unit tests (install tools + start emulator, debug)
        run: |
          # Install firebase-tools and verify installation
          npm install -g firebase-tools
          firebase --version

          # Start the Firestore emulator with debug logging to capture startup details
          firebase --debug emulators:exec --only firestore -- node ./scripts/test-firestore-rules.cjs

  deploy-rules:
    name: Deploy Firestore Rules & Indexes
    needs: test-rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase Tools
        run: npm ci --production && npm install -g firebase-tools
      - name: Authenticate with service account
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > serviceAccountKey.json
          # Set GOOGLE_APPLICATION_CREDENTIALS so firebase-tools and gcloud can use the key
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/serviceAccountKey.json" >> $GITHUB_ENV

      - name: Deploy Firestore rules & indexes
        run: |
          npm install -g firebase-tools
          firebase deploy --only firestore --project=edusync-sis
