name: Firestore rules CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test-rules:
    name: Test Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Firestore rules unit tests
        # emulators:exec handles emulator startup, readiness, FIRESTORE_EMULATOR_HOST
        # injection and teardown, and propagates the test exit code.
        run: npx firebase emulators:exec --only firestore --project emu-test -- "node scripts/tests/firestore-rules.test.cjs"

  deploy-rules:
    name: Deploy Firestore Rules & Indexes
    needs: test-rules
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Check for deploy credentials
        id: creds
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT_BASE64 not set - skipping deploy."
            echo "available=false" >> $GITHUB_OUTPUT
          else
            echo "available=true" >> $GITHUB_OUTPUT
          fi
      - name: Authenticate with service account
        if: steps.creds.outputs.available == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 --decode > "$RUNNER_TEMP/serviceAccountKey.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/serviceAccountKey.json" >> $GITHUB_ENV

      - name: Deploy Firestore rules & indexes
        if: steps.creds.outputs.available == 'true'
        run: npx firebase deploy --only firestore --project=edusync-sis
