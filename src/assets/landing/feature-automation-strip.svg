<svg width="1440" height="600" viewBox="0 0 1440 600" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">EduSync Teacher Workflow - Real Interface</title>
  <desc id="desc">Screenshot-based workflow showing student management, grading, forms, and reports in the personal workspace.</desc>
  <defs>
    <linearGradient id="bg-workflow" x1="0" y1="0" x2="1440" y2="600" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F1729"/>
      <stop offset="1" stop-color="#1A1F33"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="600" fill="url(#bg-workflow)"/>

  <!-- Step 1: Student Master List -->
  <g transform="translate(60 100)">
    <rect x="0" y="0" width="280" height="400" rx="16" fill="#0B1324" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="280" height="48" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="32" fill="#E2E8F0" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">My Students</text>
    
    <!-- Search bar -->
    <rect x="12" y="62" width="256" height="36" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="24" y="87" fill="#94A3B8" font-size="13" font-family="'Segoe UI', sans-serif">Search students...</text>
    
    <!-- Student rows -->
    <rect x="12" y="110" width="256" height="32" rx="6" fill="#0B162E" stroke="#1E40AF" stroke-width="0.5"/>
    <text x="24" y="132" fill="#BFDBFE" font-size="12" font-weight="500" font-family="'Segoe UI', sans-serif">Maria Santos</text>
    <circle cx="252" cy="126" r="4" fill="#10B981"/>
    
    <rect x="12" y="152" width="256" height="32" rx="6" fill="#0B162E" stroke="#1E40AF" stroke-width="0.5"/>
    <text x="24" y="174" fill="#BFDBFE" font-size="12" font-weight="500" font-family="'Segoe UI', sans-serif">Juan Reyes</text>
    <circle cx="252" cy="168" r="4" fill="#10B981"/>
    
    <rect x="12" y="194" width="256" height="32" rx="6" fill="#0B162E" stroke="#1E40AF" stroke-width="0.5"/>
    <text x="24" y="216" fill="#BFDBFE" font-size="12" font-weight="500" font-family="'Segoe UI', sans-serif">Ana Cruz</text>
    <circle cx="252" cy="210" r="4" fill="#10B981"/>
    
    <rect x="12" y="236" width="256" height="32" rx="6" fill="#0B162E" stroke="#1E40AF" stroke-width="0.5"/>
    <text x="24" y="258" fill="#BFDBFE" font-size="12" font-weight="500" font-family="'Segoe UI', sans-serif">Luis Fernandez</text>
    <circle cx="252" cy="252" r="4" fill="#10B981"/>
    
    <rect x="12" y="278" width="256" height="32" rx="6" fill="#0B162E" stroke="#1E40AF" stroke-width="0.5"/>
    <text x="24" y="300" fill="#BFDBFE" font-size="12" font-weight="500" font-family="'Segoe UI', sans-serif">Rosa Mendoza</text>
    <circle cx="252" cy="294" r="4" fill="#10B981"/>
    
    <!-- Footer stats -->
    <rect x="12" y="340" width="256" height="48" rx="8" fill="#052E2B" stroke="#047857" stroke-width="0.5"/>
    <text x="24" y="360" fill="#6EE7B7" font-size="11" font-family="'Segoe UI', sans-serif">Total Students: 47</text>
    <text x="24" y="378" fill="#6EE7B7" font-size="11" font-family="'Segoe UI', sans-serif">Active: 45 | At Risk: 2</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(380, 290)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#22D3EE" stroke-width="3" stroke-linecap="round"/>
    <polygon points="40,0 52,0 46,-6" fill="#22D3EE"/>
  </g>

  <!-- Step 2: Class Record / Gradebook -->
  <g transform="translate(460 100)">
    <rect x="0" y="0" width="300" height="400" rx="16" fill="#0B1324" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="300" height="48" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="32" fill="#E2E8F0" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Class Record Q1</text>
    
    <!-- Column headers -->
    <rect x="12" y="62" width="276" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="0.5"/>
    <text x="20" y="80" fill="#CBD5E1" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">Student</text>
    <text x="130" y="80" fill="#CBD5E1" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">Math</text>
    <text x="170" y="80" fill="#CBD5E1" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">Science</text>
    <text x="230" y="80" fill="#CBD5E1" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">Avg</text>
    
    <!-- Data rows -->
    <rect x="12" y="100" width="276" height="26" rx="4" fill="#052B22" stroke="#047857" stroke-width="0.5" fill-opacity="0.4"/>
    <text x="20" y="118" fill="#A7F3D0" font-size="11" font-family="'Segoe UI', sans-serif">Maria Santos</text>
    <rect x="130" y="105" width="28" height="18" rx="3" fill="#10B981"/>
    <text x="138" y="116" fill="white" font-size="10" font-weight="600" font-family="'Segoe UI', sans-serif">92</text>
    <rect x="170" y="105" width="28" height="18" rx="3" fill="#10B981"/>
    <text x="178" y="116" fill="white" font-size="10" font-weight="600" font-family="'Segoe UI', sans-serif">88</text>
    <text x="235" y="118" fill="#A7F3D0" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">90</text>
    
    <rect x="12" y="135" width="276" height="26" rx="4" fill="#052B22" stroke="#047857" stroke-width="0.5" fill-opacity="0.4"/>
    <text x="20" y="153" fill="#A7F3D0" font-size="11" font-family="'Segoe UI', sans-serif">Juan Reyes</text>
    <rect x="130" y="140" width="28" height="18" rx="3" fill="#10B981"/>
    <text x="138" y="151" fill="white" font-size="10" font-weight="600" font-family="'Segoe UI', sans-serif">85</text>
    <rect x="170" y="140" width="28" height="18" rx="3" fill="#F59E0B"/>
    <text x="178" y="151" fill="white" font-size="10" font-weight="600" font-family="'Segoe UI', sans-serif">73</text>
    <text x="235" y="153" fill="#A7F3D0" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">79</text>
    
    <rect x="12" y="170" width="276" height="26" rx="4" fill="#2A0F18" stroke="#BE123C" stroke-width="0.5" fill-opacity="0.4"/>
    <text x="20" y="188" fill="#FDA4AF" font-size="11" font-family="'Segoe UI', sans-serif">Ana Cruz</text>
    <rect x="130" y="175" width="28" height="18" rx="3" fill="#FB7185"/>
    <text x="138" y="186" fill="white" font-size="10" font-weight="600" font-family="'Segoe UI', sans-serif">62</text>
    <rect x="170" y="175" width="28" height="18" rx="3" fill="#FB7185"/>
    <text x="178" y="186" fill="white" font-size="10" font-weight="600" font-family="'Segoe UI', sans-serif">58</text>
    <text x="235" y="188" fill="#FDA4AF" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">60</text>
    
    <!-- More students indicator -->
    <rect x="12" y="210" width="276" height="20" rx="4" fill="#1E293B" fill-opacity="0.6"/>
    <text x="139" y="223" fill="#94A3B8" font-size="10" font-family="'Segoe UI', sans-serif">+44 more students</text>
    
    <!-- Action bar -->
    <rect x="12" y="310" width="276" height="28" rx="6" fill="#1D4ED8" fill-opacity="0.2" stroke="#1D4ED8" stroke-width="0.5"/>
    <text x="24" y="330" fill="#93C5FD" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">Save &amp; Generate SF9</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(800, 290)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <polygon points="40,0 52,0 46,-6" fill="#10B981"/>
  </g>

  <!-- Step 3: Forms and Reports -->
  <g transform="translate(1060 100)">
    <rect x="0" y="0" width="300" height="400" rx="16" fill="#0B1324" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="300" height="48" rx="16" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="16" y="32" fill="#E2E8F0" font-size="14" font-weight="600" font-family="'Segoe UI', sans-serif">Generated Forms</text>
    
    <!-- Tabs -->
    <rect x="12" y="62" width="138" height="32" rx="6" fill="#052E2B" stroke="#047857" stroke-width="1"/>
    <text x="36" y="84" fill="#6EE7B7" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Ready (8)</text>
    
    <rect x="158" y="62" width="138" height="32" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1"/>
    <text x="180" y="84" fill="#94A3B8" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">Pending (3)</text>
    
    <!-- Form items -->
    <rect x="12" y="110" width="276" height="42" rx="8" fill="#052E2B" stroke="#047857" stroke-width="0.5"/>
    <circle cx="28" cy="131" r="6" fill="#10B981"/>
    <text x="48" y="132" fill="#A7F3D0" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">SF10 (Permanent Record)</text>
    <text x="48" y="146" fill="#6EE7B7" font-size="10" font-family="'Segoe UI', sans-serif">✓ Ready to Print</text>
    
    <rect x="12" y="162" width="276" height="42" rx="8" fill="#052E2B" stroke="#047857" stroke-width="0.5"/>
    <circle cx="28" cy="183" r="6" fill="#10B981"/>
    <text x="48" y="184" fill="#A7F3D0" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">SF9 (Report Card)</text>
    <text x="48" y="198" fill="#6EE7B7" font-size="10" font-family="'Segoe UI', sans-serif">✓ Ready to Print</text>
    
    <rect x="12" y="214" width="276" height="42" rx="8" fill="#052E2B" stroke="#047857" stroke-width="0.5"/>
    <circle cx="28" cy="235" r="6" fill="#10B981"/>
    <text x="48" y="236" fill="#A7F3D0" font-size="12" font-weight="600" font-family="'Segoe UI', sans-serif">SF9 (Class Record)</text>
    <text x="48" y="250" fill="#6EE7B7" font-size="10" font-family="'Segoe UI', sans-serif">✓ Ready to Print</text>
    
    <!-- Summary -->
    <rect x="12" y="310" width="276" height="78" rx="8" fill="#1D4ED8" fill-opacity="0.15" stroke="#1D4ED8" stroke-width="0.5"/>
    <text x="24" y="328" fill="#93C5FD" font-size="11" font-weight="600" font-family="'Segoe UI', sans-serif">All Forms Ready</text>
    <text x="24" y="346" fill="#93C5FD" font-size="10" font-family="'Segoe UI', sans-serif">DepEd compliance: 100%</text>
    <text x="24" y="365" fill="#93C5FD" font-size="10" font-family="'Segoe UI', sans-serif">Last generated: Today 2:45 PM</text>
    <rect x="24" y="370" width="252" height="2" rx="1" fill="#1D4ED8" fill-opacity="0.4"/>
  </g>
</svg>

